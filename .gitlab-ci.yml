stages:
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  # Enable BuildKit for faster, cache-friendly builds
  DOCKER_BUILDKIT: "1"
  # Optional but recommended for performance
  DOCKER_DRIVER: overlay2

.build_template: &build_template
  stage: build
  image: docker:26
  services:
    - name: docker:26-dind
      alias: docker
  # Make sure to use a runner with the dind tag (that can actually build) and ude-sse
  tags:
    - dind
    - ude-sse
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build_frontend:
  <<: *build_template
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/frontend"
    - SHA_TAG="$CI_COMMIT_SHORT_SHA"
    - BRANCH_TAG="$CI_COMMIT_REF_SLUG"
    - FRONTEND_BUILD_ARGS="--build-arg NODE_IMAGE=node:22-alpine --build-arg NGINX_IMAGE=nginx:alpine"

    - docker build $FRONTEND_BUILD_ARGS -t "$IMAGE:$SHA_TAG" frontend/
    - docker push "$IMAGE:$SHA_TAG"

    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$SHA_TAG" "$IMAGE:$BRANCH_TAG"
        docker push "$IMAGE:$BRANCH_TAG"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE:$SHA_TAG" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$SHA_TAG" "$IMAGE:$CI_COMMIT_TAG"
        docker push "$IMAGE:$CI_COMMIT_TAG"
      fi

build_backend:
  <<: *build_template
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/backend"
    - SHA_TAG="$CI_COMMIT_SHORT_SHA"
    - BRANCH_TAG="$CI_COMMIT_REF_SLUG"
    - BACKEND_BUILD_ARGS="--build-arg GRADLE_IMAGE=gradle:jdk21 --build-arg RUNTIME_IMAGE=eclipse-temurin:21-jre"

    - docker build $BACKEND_BUILD_ARGS -t "$IMAGE:$SHA_TAG" backend/
    - docker push "$IMAGE:$SHA_TAG"

    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$SHA_TAG" "$IMAGE:$BRANCH_TAG"
        docker push "$IMAGE:$BRANCH_TAG"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE:$SHA_TAG" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$SHA_TAG" "$IMAGE:$CI_COMMIT_TAG"
        docker push "$IMAGE:$CI_COMMIT_TAG"
      fi