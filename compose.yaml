services:
  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sep
      SPRING_DATASOURCE_USERNAME: sep
      SPRING_DATASOURCE_PASSWORD: sepsep123
    restart: unless-stopped
    ports:
      - 8080:8080
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - 4200:80
    depends_on:
      - backend
    
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: sep
      POSTGRES_USER: sep
      POSTGRES_PASSWORD: sepsep123
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - 5432:5432

volumes:
  db_data:
