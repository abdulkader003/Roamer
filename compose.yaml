services:
  backend:
    profiles:
      - app
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sep
      DB_USERNAME: sep
      DB_PASSWORD: sepsep123
      SERVER_PORT: 8080
    ports:
      - 8080:8080
    depends_on:
      - db

  frontend:
    profiles:
      - app
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - 4200:80
    depends_on:
      - backend
    
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: sep
      POSTGRES_USER: sep
      POSTGRES_PASSWORD: sepsep123
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - 5433:5432

volumes:
  db_data:
