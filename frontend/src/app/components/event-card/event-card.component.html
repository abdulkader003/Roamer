<button class="event-card" [ngClass]="toneClass" type="button" (click)="openDetails($event)">
  <span class="event-title">{{ event.title }}</span>

  @if (event.startTime || event.location) {
    <span class="event-meta">
      @if (event.startTime) {
        <span>{{ event.startTime }}</span>
      }
      @if (event.startTime && event.location) {
        <span> &middot; </span>
      }
      @if (event.location) {
        <span>{{ event.location }}</span>
      }
    </span>
  }

  @if (event.category) {
    <span class="event-category">
      {{ event.category }}
    </span>
  }
</button>
