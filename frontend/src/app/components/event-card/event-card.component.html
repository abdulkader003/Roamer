<button class="event-card" [ngClass]="[toneClass, durationClass]" type="button" (click)="openDetails($event)">
  <span class="event-title">{{ event.title }}</span>

  @if (metaLabel) {
    <span class="event-meta">
      {{ metaLabel }}
    </span>
  }

  @if (categoryLabel) {
    <span class="event-category">
      {{ categoryLabel }}
    </span>
  }
</button>
