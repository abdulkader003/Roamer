<div class="calendar-page">
  <div class="calendar-card">

    <div class="calendar-toolbar">
      <div class="month-navigation">
        <h2>{{ currentMonth }}</h2>
        <div class="month-buttons">
          <button class="nav-button" (click)="goToPreviousMonth()">‹</button>
          <button class="today-button" (click)="goToToday()">Today</button>
          <button class="nav-button" (click)="goToNextMonth()">›</button>
        </div>
      </div>

      <div class="toolbar-center">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Search events..." />
        </div>
      </div>

      <div class="toolbar-actions">
        <button class="add-event-button" (click)="addEvent()">+ Add Event</button>

        <div class="view-toggle">
          <button
            class="view-btn"
            [class.active]="viewMode === 'week'"
            (click)="setViewMode('week')">
            Week
          </button>

          <button
            class="view-btn"
            [class.active]="viewMode === 'month'"
            (click)="setViewMode('month')">
            Month
          </button>
        </div>
      </div>
    </div>

    <!-- ================= MONTH VIEW ================= -->
    <div class="calendar-grid" *ngIf="viewMode === 'month'">
      <div class="weekday" *ngFor="let day of weekdays">
        {{ day }}
      </div>

      <div class="day other-month" *ngFor="let day of prevMonthDays">
        <div class="day-number">{{ day }}</div>
        <div class="events-container" aria-hidden="true"></div>
      </div>

      <div
        class="day"
        *ngFor="let day of days"
        [class.selected-day]="day === selectedDay"
        [class.today-day]="isToday(day)"
        (click)="selectDay(day)">

        <div class="day-number">{{ day }}</div>

        <div class="events-container">
          <app-event-card
            *ngFor="let event of getEventsForDate(getDateForDay(day))"
            [event]="event"
            (viewDetails)="selectedEvent = $event">
          </app-event-card>
        </div>
      </div>

      <div class="day other-month" *ngFor="let day of nextMonthDays">
        <div class="day-number">{{ day }}</div>
        <div class="events-container" aria-hidden="true"></div>
      </div>
    </div>

    <!-- ================= WEEK VIEW ================= -->
    <div class="week-view" *ngIf="viewMode === 'week'">
      <div class="week-day" *ngFor="let date of weekDays; let i = index">

        <div class="week-day-name">
          {{ weekdays[i] }}
        </div>


        <div
          class="week-day-box"
          [class.today-week-day]="isTodayDate(date)"
          [class.selected-week-day]="date.getDate() === selectedDay"
          (click)="selectDay(date.getDate())">

          <div class="week-date-number">
            {{ date.getDate() }}
          </div>

          <div class="events-container">
            <app-event-card
              *ngFor="let event of getEventsForDate(getDateForDate(date))"
              [event]="event"
              (viewDetails)="selectedEvent = $event">
            </app-event-card>
          </div>
        </div>
      </div>
    </div>

  </div>
  <div
    class="event-drawer-overlay"
    *ngIf="isEventDrawerOpen"
    (click)="closeEventDrawer()">
    <aside class="event-drawer" (click)="$event.stopPropagation()">
      <div class="event-drawer-header">
        <div>
          <p class="event-drawer-eyebrow">Plan Details</p>
          <h3>Add Event</h3>
        </div>

        <button
          type="button"
          class="drawer-close-button"
          aria-label="Close add event panel"
          (click)="closeEventDrawer()">
          ×
        </button>
      </div>

      <form class="event-form" (ngSubmit)="saveEvent()">
        <label class="form-field">
          <span>Event title</span>
          <input
            type="text"
            name="title"
            [(ngModel)]="eventDraft.title"
            placeholder="Sunset Catamaran Cruise"
            required />
        </label>

        <label class="form-field">
          <span>Event description</span>
          <textarea
            name="description"
            [(ngModel)]="eventDraft.description"
            rows="3"
            placeholder="Add a short summary of the plan"></textarea>
        </label>

        <label class="form-field">
          <span>Location</span>
          <input
            type="text"
            name="location"
            [(ngModel)]="eventDraft.location"
            placeholder="Mykonos Old Port" />
        </label>

        <div class="form-row form-row--double">
          <label class="form-field">
            <span>Date</span>
            <input type="date" name="date" [(ngModel)]="eventDraft.date" required />
          </label>

          <label class="form-field">
            <span>Category</span>
            <select name="category" [(ngModel)]="eventDraft.category">
              <option *ngFor="let category of eventCategories" [value]="category">
                {{ category }}
              </option>
            </select>
          </label>
        </div>

        <div class="form-row form-row--double">
          <label class="form-field">
            <span>Start time</span>
            <input type="time" name="startTime" [(ngModel)]="eventDraft.startTime" />
          </label>

          <label class="form-field">
            <span>End time</span>
            <input type="time" name="endTime" [(ngModel)]="eventDraft.endTime" />
          </label>
        </div>

        <label class="form-field">
          <span>Budget / cost</span>
          <input
            type="number"
            name="budget"
            [(ngModel)]="eventDraft.budget"
            min="0"
            step="0.01"
            placeholder="120.00" />
        </label>

        <label class="form-field">
          <span>Notes</span>
          <textarea
            name="notes"
            [(ngModel)]="eventDraft.notes"
            rows="5"
            placeholder="Reservation details, contacts, dress code, reminders..."></textarea>
        </label>

        <div class="event-form-actions">
          <button type="button" class="secondary-button" (click)="cancelEventForm()">
            Cancel
          </button>
          <button type="submit" class="primary-button">Save Event</button>
        </div>
      </form>
    </aside>
  </div>
