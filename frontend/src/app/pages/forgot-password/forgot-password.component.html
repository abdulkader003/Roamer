<section class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <p class="auth-eyebrow">Password recovery</p>
      <h1>Reset your password</h1>
      <p class="auth-copy">
        Enter your account email and we will send a verification code so you can set a new password.
      </p>
    </div>

    <form class="auth-form" #forgotPasswordForm="ngForm" (ngSubmit)="submit(forgotPasswordForm)" novalidate>
      <label class="auth-field">
        <span>Email</span>
        <input
          type="email"
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
          email
          [(ngModel)]="email" />
      </label>

      @if (hasRequestedCode) {
        <label class="auth-field">
          <span>Verification code</span>
          <input
            type="text"
            name="code"
            autocomplete="one-time-code"
            inputmode="numeric"
            maxlength="6"
            placeholder="123456"
            [(ngModel)]="code" />
        </label>
      }

      @if (message) {
        <div [class.success-message]="isSuccess" [class.error-message]="!isSuccess">{{ message }}</div>
      }

      <button class="auth-button" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? (hasRequestedCode ? 'Verifying code...' : 'Sending code...') : (hasRequestedCode ? 'Verify code' : 'Send reset code') }}
      </button>
    </form>

    <div class="auth-actions">
      @if (hasRequestedCode) {
        <button class="auth-secondary" type="button" (click)="requestCode()" [disabled]="isSubmitting">
          Send a new code
        </button>
      }
      <a routerLink="/login">Back to login</a>
    </div>
  </div>
</section>
