<section class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <p class="auth-eyebrow">Password recovery</p>
      <h1>Create a new password</h1>
      <p class="auth-copy">
        Set a new password for <strong>{{ email }}</strong>. You will use it the next time you sign in.
      </p>
    </div>

    <form class="auth-form" #resetPasswordForm="ngForm" (ngSubmit)="submit(resetPasswordForm)" novalidate>
      <div class="auth-field">
        <label for="password">New password</label>
        <span class="password-control">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            autocomplete="new-password"
            placeholder="Enter new password"
            required
            minlength="8"
            [(ngModel)]="password" />
          <button
            class="password-toggle"
            type="button"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
            (mousedown)="$event.preventDefault()"
            (click)="togglePasswordVisibility('password')">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </span>
      </div>

      <div class="auth-field">
        <label for="confirmPassword">Confirm new password</label>
        <span class="password-control">
          <input
            id="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            name="confirmPassword"
            autocomplete="new-password"
            placeholder="Confirm new password"
            required
            [(ngModel)]="confirmPassword" />
          <button
            class="password-toggle"
            type="button"
            [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showConfirmPassword"
            (mousedown)="$event.preventDefault()"
            (click)="togglePasswordVisibility('confirmPassword')">
            {{ showConfirmPassword ? 'Hide' : 'Show' }}
          </button>
        </span>
      </div>

      @if (message) {
        <div class="error-message">{{ message }}</div>
      }

      <button class="auth-button" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Saving new password...' : 'Save new password' }}
      </button>
    </form>

    <p class="auth-switch">
      Remembered it?
      <a routerLink="/login">Back to login</a>
    </p>
  </div>
</section>
