<figure
  class="roamer-avatar"
  aria-hidden="true"
  [class.roamer-avatar--password-hidden]="mood === 'password-hidden' && !eyelidsClosed"
  [class.roamer-avatar--password-visible]="eyelidsClosed"
  [class.roamer-avatar--auto-blinking]="isBlinking"
  [style.--pupil-x.px]="pupilOffsetX"
  [style.--pupil-y.px]="pupilOffsetY">
  <svg class="avatar-art" viewBox="0 0 440 470" focusable="false" role="img">
    <defs>
      <radialGradient id="globeSkin" cx="33%" cy="22%" r="78%">
        <stop offset="0" stop-color="#ffffff" />
        <stop offset="0.36" stop-color="#e5f7ff" />
        <stop offset="0.7" stop-color="#6fc8f5" />
        <stop offset="1" stop-color="#2563d9" />
      </radialGradient>

      <linearGradient id="landWash" x1="96" y1="96" x2="312" y2="285" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#dff8ff" />
        <stop offset="1" stop-color="#aee6ff" />
      </linearGradient>

      <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#1a56db" flood-opacity="0.18" />
      </filter>
    </defs>

    <ellipse class="avatar-shadow" cx="222" cy="426" rx="128" ry="20" />

    <g class="avatar-limbs avatar-limbs--behind">

            d="M92 300 C105 289 127 293 137 309 C129 326 103 331 89 316 C83 309 84 303 92 300 Z" />

          <path

              C80 340 103 343 119 334
              C137 324 148 305 142 287
              C137 271 121 264 106 270

          <path class="glove-thumb-line" d="M73 286 C87 289 94 300 90 314" />

          <path class="glove-palm-line" d="M78 319 C96 329 123 324 135 304" />

      <g class="avatar-arm avatar-arm--right">

          d="M318 222 C354 229 379 257 377 291 C376 309 362 321 343 309" />

        <g class="avatar-hand avatar-hand--right">

        </g>
      </g>
    </g>

    <g class="avatar-legs">
      <g class="avatar-leg avatar-leg--left">
        <path class="leg-stroke" d="M173 306 C167 347 147 381 116 403" />

          class="avatar-shoe avatar-shoe--left"

      <g class="avatar-leg avatar-leg--right">

            M293 406

            C411 420 393 433 363 437
            C331 441 302 434 293 417

    <g class="avatar-body" filter="url(#softShadow)">

      <g class="globe-grid">
        <path d="M84 191 H356" />
        <path d="M116 126 C174 154 267 154 326 126" />
        <path d="M116 256 C174 228 267 228 326 256" />
        <path d="M220 55 C178 124 178 258 220 327" />
        <path d="M220 55 C262 124 262 258 220 327" />

      <g class="avatar-face">
        <g class="avatar-eyebrows">

          <path
            class="avatar-eyebrow avatar-eyebrow--right"

        <g class="avatar-eye avatar-eye--left">

          <path class="eye-lid eye-lid--bottom" d="M246 194 C259 203 277 204 289 194" />

        <circle class="cheek cheek--left" cx="139" cy="218" r="13" />
        <circle class="cheek cheek--right" cx="301" cy="218" r="13" />

    </g>

    <g class="avatar-limbs avatar-limbs--front">
      <path class="cuff cuff--left" d="M111 214 C124 210 139 211 151 219" />
      <path class="cuff cuff--right" d="M292 217 C305 208 320 205 335 209" />
    </g>
  </svg>
</figure>
