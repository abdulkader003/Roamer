<figure
  class="roamer-avatar"
  aria-hidden="true"
  [class.roamer-avatar--password-hidden]="mood === 'password-hidden'"
  [class.roamer-avatar--password-visible]="mood === 'password-visible'"
  [style.--pupil-x.px]="pupilOffsetX"
  [style.--pupil-y.px]="pupilOffsetY">
  <svg class="avatar-art" viewBox="0 0 440 470" focusable="false" role="img">
    <defs>
      <radialGradient id="globeSkin" cx="33%" cy="22%" r="78%">
        <stop offset="0" stop-color="#ffffff" />
        <stop offset="0.36" stop-color="#e5f7ff" />
        <stop offset="0.7" stop-color="#6fc8f5" />
        <stop offset="1" stop-color="#2563d9" />
      </radialGradient>
      <linearGradient id="landWash" x1="96" y1="96" x2="312" y2="285" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#dff8ff" />
        <stop offset="1" stop-color="#aee6ff" />
      </linearGradient>
      <linearGradient id="shoeShine" x1="106" y1="362" x2="332" y2="426" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffffff" />
        <stop offset="1" stop-color="#dbeafe" />
      </linearGradient>
      <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#1a56db" flood-opacity="0.18" />
      </filter>
    </defs>

    <ellipse class="avatar-shadow" cx="222" cy="426" rx="128" ry="20" />

    <g class="avatar-limbs avatar-limbs--behind">
      <g class="avatar-arm avatar-arm--left">
        <path class="arm-sleeve" d="M119 215c-43 5-72 35-72 72 0 28 19 48 48 52" />
        <g class="avatar-hand avatar-hand--left">
          <path class="hand-palm" d="M82 313c-16-14-15-39 4-51 10-6 23-5 34 4 14-9 33 0 37 18 18 4 25 24 12 40-17 21-62 18-87-11z" />
          <path class="hand-finger" d="M94 262c1-17 21-23 31-8" />
          <path class="hand-finger" d="M126 264c9-14 29-9 31 9" />
          <path class="hand-crease" d="M95 312c18 12 43 15 61 4" />
        </g>
      </g>

      <g class="avatar-arm avatar-arm--right">
        <path class="arm-sleeve" d="M323 212c41-12 76 7 85 43 7 30-10 58-40 72" />
        <g class="avatar-hand avatar-hand--right">
          <path class="hand-palm" d="M345 307c-6-21 8-41 29-44 7-17 31-17 39 0 19 0 31 19 22 37-9 22-50 40-90 7z" />
          <path class="hand-finger" d="M373 263c2-17 24-20 32-5" />
          <path class="hand-finger" d="M405 264c13-9 30 3 27 20" />
          <path class="hand-crease" d="M359 311c19 7 43 4 60-9" />
        </g>
      </g>
    </g>

    <g class="avatar-legs">
      <g class="avatar-leg avatar-leg--left">
        <path class="leg-stroke" d="M173 306c-6 40-24 74-54 98" />
        <path class="avatar-shoe avatar-shoe--left" d="M77 404c25-29 68-30 92 4-15 21-70 26-92-4z" />
        <path class="shoe-sole" d="M84 410c23 13 54 13 77 1" />
      </g>
      <g class="avatar-leg avatar-leg--right">
        <path class="leg-stroke" d="M267 306c8 40 30 72 64 94" />
        <path class="avatar-shoe avatar-shoe--right" d="M294 407c22-36 65-38 92-10-19 33-75 31-92 10z" />
        <path class="shoe-sole" d="M306 411c24 10 56 7 74-7" />
      </g>
    </g>

    <g class="avatar-body" filter="url(#softShadow)">
      <circle class="globe-body" cx="220" cy="191" r="136" />
      <path class="globe-highlight" d="M115 168c11-65 61-114 126-120" />

      <g class="globe-landmarks">
        <path class="land land--left" d="M125 123c25-45 93-56 128-22 20 19 8 42 30 58 30 23 18 72-29 94-54 25-110-6-105-44 3-25-35-31-24-86z" />
        <path class="land land--right" d="M277 80c43 19 73 60 78 109-33-9-59-28-70-58-6-17-22-30-8-51z" />
        <path class="land land--bottom" d="M175 274c32 14 68 12 100-5-14 30-45 50-82 51-16-9-24-24-18-46z" />
      </g>

      <g class="globe-grid">
        <path d="M84 191h272" />
        <path d="M116 126c58 28 151 28 210 0" />
        <path d="M116 256c58-28 151-28 210 0" />
        <path d="M220 55c-42 69-42 203 0 272" />
        <path d="M220 55c42 69 42 203 0 272" />
      </g>

      <g class="avatar-face">
        <g class="avatar-eye avatar-eye--left">
          <ellipse class="eye-white" cx="174" cy="175" rx="25" ry="31" />
          <circle class="eye-pupil" cx="181" cy="182" r="10" />
          <circle class="eye-spark" cx="177" cy="176" r="3" />
          <path class="eye-lid eye-lid--top" d="M151 166c13-15 33-17 48-3" />
          <path class="eye-lid eye-lid--bottom" d="M154 194c13 9 31 10 43 0" />
        </g>

        <g class="avatar-eye avatar-eye--right">
          <ellipse class="eye-white" cx="266" cy="175" rx="25" ry="31" />
          <circle class="eye-pupil" cx="273" cy="182" r="10" />
          <circle class="eye-spark" cx="269" cy="176" r="3" />
          <path class="eye-lid eye-lid--top" d="M243 163c15-13 35-12 48 3" />
          <path class="eye-lid eye-lid--bottom" d="M246 194c13 9 31 10 43 0" />
        </g>

        <circle class="cheek cheek--left" cx="139" cy="218" r="13" />
        <circle class="cheek cheek--right" cx="301" cy="218" r="13" />
        <path class="avatar-mouth" d="M174 228c19 28 73 28 93 0" />
        <path class="mouth-corner" d="M162 224c7 4 14 5 20 2" />
        <path class="mouth-corner" d="M258 226c8 3 15 2 21-3" />
      </g>
    </g>

    <g class="avatar-limbs avatar-limbs--front">
      <path class="cuff cuff--left" d="M111 214c13-4 28-3 40 5" />
      <path class="cuff cuff--right" d="M292 217c13-9 28-12 43-8" />
    </g>
  </svg>
</figure>
